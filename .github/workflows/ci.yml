name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# A PR keeps one concurrency slot; newer commits cancel only the superseded PR run.
# Non-PR runs use their unique run ID, so master, scheduled, and manual runs do
# perform work independently.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Required check name: keep in sync with the Protect master ruleset.
  minimum-node:
    name: Minimum Node 22.23.2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup minimum Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run property tests
        run: npm run test:property
      - name: Verify extension loads
        run: >-
          PI_OFFLINE=1 npx --no-install pi --offline --no-session
          -e ./src/subagent.ts --help
      - name: Verify package can be packed
        run: npm run pack:check

  test:
    name: Test (Pi ${{ matrix.pi-version }})
    runs-on: ubuntu-latest
    # Per-test bounds exist, but nothing the runner enforces bounds vitest worker
    # shutdown or a wedged tmux server; without this a hang burns the 360 min
    # default across both required matrix legs.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pi-version: ["0.80.6", "latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        if: matrix.pi-version == '0.80.6'
        run: npm run format:check

      - name: Install selected Pi SDK
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: >-
          npm install --no-save --package-lock=false
          "@earendil-works/pi-agent-core@${PI_VERSION}"
          "@earendil-works/pi-ai@${PI_VERSION}"
          "@earendil-works/pi-coding-agent@${PI_VERSION}"
          "@earendil-works/pi-tui@${PI_VERSION}"

      # Pi 0.85.0's published coding-agent package imports pi-server
      # without declaring it. The official bundled CLI is unaffected; this
      # compatibility install covers direct SDK imports used by these tests.
      # Remove it when upstream publishes a complete dependency graph.
      - name: Install latest Pi server compatibility dependency
        if: matrix.pi-version == 'latest'
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: npm install --no-save --package-lock=false "@earendil-works/pi-server@${PI_VERSION}"

      - name: Verify extension loads in selected Pi
        run: |
          npx --no-install pi --version
          PI_OFFLINE=1 npx --no-install pi --offline --no-session \
            -e ./src/subagent.ts --help

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      # Pi 0.80.6 uses fd and ripgrep to discover the explicitly loaded
      # resources shown in the terminal startup screen. The harness asserts
      # that both the fixture provider and extension were loaded.
      - name: Install terminal E2E search tools
        if: matrix.pi-version == '0.80.6'
        run: |
          sudo apt-get install -y fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          fd --version
          rg --version

      # zellij is not in apt, so pull the prebuilt musl binary from the release
      # the backend is verified against. Without a real zellij on PATH the whole
      # zellij suite is mocked, which is exactly how a `dump-screen` argv that
      # zellij rejects outright shipped with CI green.
      - name: Install zellij
        env:
          ZELLIJ_VERSION: v0.44.3
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zellij.tar.gz \
            "https://github.com/zellij-org/zellij/releases/download/${ZELLIJ_VERSION}/zellij-x86_64-unknown-linux-musl.tar.gz"
          sudo tar -xzf /tmp/zellij.tar.gz -C /usr/local/bin zellij
          sudo chmod +x /usr/local/bin/zellij
          zellij --version

      - name: Type check
        run: npm run typecheck

      # Coverage runs the same unit/property/Pi-session set on the pinned SDK.
      # The latest SDK leg runs that set normally, preserving SDK compatibility
      # without executing either set twice on the same leg.
      - name: Run unit tests
        if: matrix.pi-version == 'latest'
        run: npm run test:unit

      - name: Run Pi session integration tests
        if: matrix.pi-version == 'latest'
        run: npm run test:pi
      - name: Run unit and Pi session tests with coverage thresholds
        if: matrix.pi-version == '0.80.6'
        run: npm run coverage:check

      # Shuffle only on nightly/manual runs. The fixed script seed makes failures
      # replayable without adding a duplicate PR test pass.
      - name: Run randomized-order tests
        if: >-
          matrix.pi-version == '0.80.6' &&
          (github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        run: npm run test:random

      # Mutation is exploratory: schedule/manual only, pinned SDK only, and never
      # a blocking signal. The script remains available for local investigation.
      - name: Run non-blocking mutation pilot
        if: >-
          matrix.pi-version == '0.80.6' &&
          (github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: npm run mutation:pilot

      - name: Run tmux integration tests
        run: npm run test:tmux
        env:
          PI_SUBAGENTURA_TMUX_SOCKET: pi-subagentura-ci-${{ github.run_id }}-${{ github.run_attempt }}
          TERM: xterm-256color

      - name: Run zellij integration tests
        run: npm run test:zellij
        env:
          TERM: xterm-256color

      # Herdr has no headless install for Linux runners and its backend only
      # operates from inside a Herdr-managed pane, so this suite self-skips
      # here today. It is wired up anyway: the step is what makes the
      # real-binary assertions behind `MUX_CAPABILITIES.herdr` run the moment a
      # runner can host Herdr, and it keeps the file from silently rotting.
      # Developers on a Herdr machine get the real coverage via `npm run
      # test:herdr`.
      - name: Run herdr integration tests
        run: npm run test:herdr
        env:
          TERM: xterm-256color

      # The terminal E2E suite stays on the pinned SDK leg. It asserts on Pi's
      # TUI paint, so a cosmetic floating-SDK change must not turn master red.
      # Unit and integration coverage remains strict on both SDK legs.
      - name: Run terminal visual E2E tests
        if: matrix.pi-version == '0.80.6'
        timeout-minutes: 8
        env:
          # The harness builds a replacement environment and picks its own
          # per-harness tmux socket (pid + random), so only the diagnostics
          # destination is worth setting here. Diagnostics are written on failure.
          SUBAGENTURA_E2E_DIAGNOSTICS: ${{ runner.temp }}/subagentura-e2e
        run: npm run test:tui
      - name: Upload terminal E2E diagnostics
        if: failure() && matrix.pi-version == '0.80.6'
        uses: actions/upload-artifact@v6
        with:
          name: terminal-e2e-${{ matrix.pi-version }}
          path: ${{ runner.temp }}/subagentura-e2e
          if-no-files-found: ignore

      # Packaging is SDK-independent, so run each packaging check once.
      - name: "Verify published tarball is loadable (regression: v2.0.0 missing helpers.ts)"
        if: matrix.pi-version == '0.80.6'
        run: npx vitest run published-tarball.test.ts
